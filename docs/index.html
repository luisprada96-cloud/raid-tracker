<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raid Tracker</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui;background:#111321;color:#e9e8f5;margin:0}main{max-width:1050px;margin:auto;padding:30px 20px}h1{font-size:2.2rem;margin-bottom:4px}h2{margin:0}h3{margin:0 0 8px}p,.muted{color:#aaaec4}section{background:#1b1e30;border:1px solid #30344c;border-radius:16px;padding:22px;margin:22px 0}button,input,textarea{font:inherit;border-radius:9px;border:1px solid #4a4d65;padding:11px}input,textarea{background:#111321;color:white;width:100%;margin:6px 0 12px}button{cursor:pointer;background:#7456d9;color:white;border:0}button:hover{filter:brightness(1.18)}button:disabled{opacity:.5;cursor:default}.secondary{background:#34384d}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#292d43;border-radius:12px;padding:12px}.hit{width:100%;min-height:112px;background:#373052;font-size:1.1rem}.number{display:block;font-size:2rem;font-weight:bold}.undo{width:100%;margin-top:7px;background:#373b51}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.tag{color:#c7b9ff}.session{margin-top:18px;padding:18px;border:1px solid #464368;border-radius:12px;background:#22243a}.days{display:grid;gap:8px;margin-top:14px}.day{background:#292d43;padding:12px;border-radius:10px}.day a{color:#c7b9ff;overflow-wrap:anywhere}.day-buttons{display:flex;gap:8px;flex-wrap:wrap}.date-form{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:15px}.date-form label{flex:1;min-width:170px}.date-form input{margin-bottom:0}.link-form{margin-top:18px}.notice{font-size:.9rem}.small{font-size:.9rem}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}main{padding:20px 14px}section{padding:16px}}
</style></head><body><main><h1>Raid Tracker</h1><p>Registra los fallos durante la raid y consulta su evolución.</p><p class="notice">Versión de prueba: los datos se guardan solo en este navegador y dispositivo. Si borras los datos del navegador, se perderán.</p><section><h2>Nueva raid</h2><form id="create"><label>Nombre de la raid<input name="name" required placeholder="Ej. Tier de junio"></label><label>Integrantes, uno por línea<textarea name="players" rows="4" required placeholder="Nombre 1&#10;Nombre 2"></textarea></label><button>Crear raid</button></form></section><div id="raids"></div></main><script>
'use strict';
const KEY='raid-tracker-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID();
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const displayDate=d=>{let [y,m,day]=d.split('-');return `${day}/${m}/${y}`};
function load(){let raids=JSON.parse(localStorage.getItem(KEY)||'[]');let changed=false;for(const r of raids){if(!Array.isArray(r.sessions)){changed=true;const days={};for(const p of r.players){for(const d of p.mistakes||[]){if(!days[d])days[d]={id:uid(),date:d,closed:true,link:'',counts:{}};days[d].counts[p.id]=(days[d].counts[p.id]||0)+1}}r.sessions=Object.values(days);for(const p of r.players)delete p.mistakes}}if(changed)save(raids);return raids}
function save(raids){localStorage.setItem(KEY,JSON.stringify(raids))}
let raids=load();let openSession={};
const total=s=>Object.values(s.counts).reduce((n,x)=>n+x,0);
const raidTotal=r=>r.sessions.reduce((n,s)=>n+total(s),0);
const getRaid=id=>raids.find(r=>r.id===id);
function render(){document.querySelector('#raids').innerHTML=raids.length?raids.map(r=>{let active=r.sessions.find(s=>s.id===openSession[r.id]);let ordered=[...r.sessions].sort((a,b)=>b.date.localeCompare(a.date));return `<section><div class="bar"><div><h2>${esc(r.name)}</h2><p class="tag">${r.archived?'Archivada':'Activa'} · ${r.players.length} integrantes · ${raidTotal(r)} fallos</p></div>${r.archived?'':`<button class="secondary" data-action="archive" data-r="${r.id}">Archivar raid</button>`}</div>${r.archived?'<p class="small">Esta raid está archivada. Puedes consultar y editar sus días.</p>':`<form class="date-form" data-form="new-day" data-r="${r.id}"><label>Nuevo día de raid<input type="date" name="date" value="${today()}" required></label><button>Empezar día</button></form>`}${active?sessionView(r,active):''}<h3 style="margin-top:22px">Días de raid</h3><div class="days">${ordered.length?ordered.map(s=>`<div class="day"><div class="bar"><div><strong>${displayDate(s.date)}</strong> · ${s.closed?'Cerrado':'En curso'} · ${total(s)} fallos${s.link?`<br><a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">Abrir FFLogs ↗</a>`:''}</div><div class="day-buttons"><button class="secondary" data-action="open" data-r="${r.id}" data-s="${s.id}">${active?.id===s.id?'Viendo día':'Ver / editar'}</button></div></div></div>`).join(''):'<p>Aún no hay días registrados.</p>'}</div></section>`}).join(''):'<p>Todavía no hay raids. Crea la primera arriba.</p>'}
function sessionView(r,s){return `<div class="session"><div class="bar"><div><h3>Día ${displayDate(s.date)}</h3><p class="tag">${s.closed?'Día cerrado · Puedes editarlo':'Día en curso'} · ${total(s)} fallos</p></div><button class="secondary" data-action="close" data-r="${r.id}" data-s="${s.id}">${s.closed?'Terminar edición':'Acabar día y guardar'}</button></div><div class="cards">${r.players.map(p=>`<div class="card"><button class="hit" data-action="add" data-r="${r.id}" data-s="${s.id}" data-p="${p.id}">${esc(p.name)}<span class="number">${s.counts[p.id]||0}</span>+ Añadir fallo</button><button class="undo" data-action="undo" data-r="${r.id}" data-s="${s.id}" data-p="${p.id}">Deshacer último fallo</button></div>`).join('')}</div><form class="link-form" data-form="link" data-r="${r.id}" data-s="${s.id}"><label>Enlace de FFLogs (opcional)<input type="url" name="link" value="${esc(s.link||'')}" placeholder="https://www.fflogs.com/reports/..."></label><button class="secondary">Guardar enlace</button> ${s.link?`<a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">Abrir enlace ↗</a>`:''}</form><p class="small">Los fallos se guardan automáticamente al pulsar.</p></div>`}
document.querySelector('#create').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim(),names=String(f.get('players')).split('\n').map(n=>n.trim()).filter(Boolean);if(!name||!names.length){alert('Introduce un nombre y al menos un integrante');return}raids.unshift({id:uid(),name,archived:false,players:names.map(name=>({id:uid(),name})),sessions:[]});save(raids);e.target.reset();render()});
document.querySelector('#raids').addEventListener('submit',e=>{e.preventDefault();const form=e.target,r=getRaid(form.dataset.r);if(!r)return;const f=new FormData(form);if(form.dataset.form==='new-day'){const date=String(f.get('date'));let s=r.sessions.find(s=>s.date===date);if(s){openSession[r.id]=s.id;alert('Ese día ya existe; lo hemos abierto para que puedas editarlo.')}else{let current=r.sessions.find(s=>!s.closed);if(current){alert('Acaba el día en curso antes de empezar otro.');return}s={id:uid(),date,closed:false,link:'',counts:{}};r.sessions.push(s);openSession[r.id]=s.id}}else if(form.dataset.form==='link'){let s=r.sessions.find(s=>s.id===form.dataset.s);let link=String(f.get('link')).trim();if(link){try{let u=new URL(link);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{alert('Introduce un enlace válido que empiece por http:// o https://');return}}s.link=link}save(raids);render()});
document.querySelector('#raids').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const r=getRaid(b.dataset.r);if(!r)return;const s=r.sessions.find(s=>s.id===b.dataset.s);switch(b.dataset.action){case 'archive':if(!confirm('¿Archivar esta raid? Podrás seguir consultando y editando sus días.'))return;r.archived=true;for(const x of r.sessions)x.closed=true;delete openSession[r.id];break;case 'open':openSession[r.id]=s.id;break;case 'close':s.closed=true;delete openSession[r.id];break;case 'add':s.counts[b.dataset.p]=(s.counts[b.dataset.p]||0)+1;break;case 'undo':s.counts[b.dataset.p]=Math.max(0,(s.counts[b.dataset.p]||0)-1);break}save(raids);render()});render();
</script></body></html>
