<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raid Tracker</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui;background:#111321;color:#e9e8f5;margin:0}main{max-width:1050px;margin:auto;padding:30px 20px}h1{font-size:2.2rem;margin-bottom:4px}h2{margin:0}h3{margin:0 0 8px}p,.muted{color:#aaaec4}section{background:#1b1e30;border:1px solid #30344c;border-radius:16px;padding:22px;margin:22px 0}button,input,textarea{font:inherit;border-radius:9px;border:1px solid #4a4d65;padding:11px}input,textarea{background:#111321;color:white;width:100%;margin:6px 0 12px}button{cursor:pointer;background:#7456d9;color:white;border:0}button:hover{filter:brightness(1.18)}button:disabled{opacity:.5;cursor:default}.secondary{background:#34384d}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#292d43;border-radius:12px;padding:12px}.hit{width:100%;min-height:112px;background:#373052;font-size:1.1rem}.number{display:block;font-size:2rem;font-weight:bold}.undo{width:100%;margin-top:7px;background:#373b51}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.tag{color:#c7b9ff}.session{margin-top:18px;padding:18px;border:1px solid #464368;border-radius:12px;background:#22243a}.days{display:grid;gap:8px;margin-top:14px}.day{background:#292d43;padding:12px;border-radius:10px}.day a{color:#c7b9ff;overflow-wrap:anywhere}.day-buttons{display:flex;gap:8px;flex-wrap:wrap}.date-form{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:15px}.date-form label{flex:1;min-width:170px}.date-form input{margin-bottom:0}.link-form{margin-top:18px}.notice{font-size:.9rem}.small{font-size:.9rem}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}main{padding:20px 14px}section{padding:16px}}
.topbar{display:flex;align-items:center;gap:14px}.topbar h1{font-size:1.55rem;margin:0}.nav{position:relative}.nav summary{list-style:none;cursor:pointer;background:#34384d;padding:10px 14px;border-radius:9px}.nav summary::-webkit-details-marker{display:none}.nav-panel{position:absolute;z-index:2;top:48px;left:0;width:220px;padding:8px;background:#292d43;border:1px solid #4a4d65;border-radius:10px;box-shadow:0 10px 26px #0008}.nav-panel button{display:block;width:100%;text-align:left;background:transparent}.library-item{padding:12px 0;border-bottom:1px solid #35384c}.library-item:last-child{border:0}.session{margin-top:4px}.date-form{margin-top:0}.day-list{margin-top:22px}a{color:#c7b9ff}[hidden]{display:none!important}
</style></head><body><main><div class="topbar"><details class="nav" id="nav"><summary aria-label="Menú">☰ Menú</summary><div class="nav-panel"><button id="show-create">＋ Crear raid</button><button id="show-library">☷ Biblioteca de raids</button></div></details><h1>Raid Tracker</h1></div><p class="notice">Los datos se guardan solo en este navegador y dispositivo.</p><section id="create-panel" hidden><div class="bar"><h2>Nueva raid</h2><button type="button" class="secondary" id="hide-create">Cerrar</button></div><form id="create"><label>Nombre de la raid<input name="name" required placeholder="Ej. Tier de junio"></label><label>Integrantes, uno por línea<textarea name="players" rows="4" required placeholder="Nombre 1&#10;Nombre 2"></textarea></label><button>Crear raid</button></form></section><section id="library" hidden><div class="bar"><h2>Biblioteca de raids</h2><button type="button" class="secondary" id="hide-library">Cerrar</button></div><div id="library-list"></div></section><div id="raids"></div></main><script>
'use strict';
const KEY='raid-tracker-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID();
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const displayDate=d=>{let [y,m,day]=d.split('-');return `${day}/${m}/${y}`};
function load(){let raids=JSON.parse(localStorage.getItem(KEY)||'[]');let changed=false;for(const r of raids){if(!Array.isArray(r.sessions)){changed=true;const days={};for(const p of r.players){for(const d of p.mistakes||[]){if(!days[d])days[d]={id:uid(),date:d,closed:true,link:'',counts:{}};days[d].counts[p.id]=(days[d].counts[p.id]||0)+1}}r.sessions=Object.values(days);for(const p of r.players)delete p.mistakes}}if(changed)save(raids);return raids}
function save(raids){localStorage.setItem(KEY,JSON.stringify(raids))}
let raids=load();let openSession={};
const total=s=>Object.values(s.counts).reduce((n,x)=>n+x,0);
const raidTotal=r=>r.sessions.reduce((n,s)=>n+total(s),0);
const getRaid=id=>raids.find(r=>r.id===id);
let selectedRaid=raids.reduce((best,r)=>!best||(r.lastSavedDay||0)>(best.lastSavedDay||0)||(!(best.lastSavedDay||r.lastSavedDay)&&(r.lastActivity||0)>(best.lastActivity||0))?r:best,null)?.id;
let editingRaid=null;let linkDrafts={};
function touch(r){r.lastActivity=Date.now()}
function activeSession(r){if(openSession[r.id]==='none')return null;if(openSession[r.id]==='draft')return {id:'draft',date:today(),closed:false,link:'',counts:{}};let chosen=r.sessions.find(s=>s.id===openSession[r.id]);if(chosen)return chosen;if(r.archived)return null;return r.sessions.find(s=>!s.closed)||r.sessions.find(s=>s.date===today())||{id:'draft',date:today(),closed:false,link:'',counts:{}}}
function materialize(r,id){if(id!=='draft')return r.sessions.find(s=>s.id===id);let existing=r.sessions.find(s=>s.date===today());if(existing)return existing;let s={id:uid(),date:today(),closed:false,link:'',counts:{}};r.sessions.push(s);if(linkDrafts[r.id+':draft']!==undefined)linkDrafts[r.id+':'+s.id]=linkDrafts[r.id+':draft'];openSession[r.id]=s.id;return s}
function render(){let library=document.querySelector('#library-list');library.innerHTML=raids.length?raids.map(r=>`<div class="library-item"><div class="bar"><div><strong>${esc(r.name)}</strong><p class="small">${r.archived?'Archivada':'Activa'} · ${r.sessions.length} días · ${raidTotal(r)} fallos</p></div><div class="day-buttons"><button data-library="dashboard" data-r="${r.id}">Añadir día en el dashboard</button><button class="secondary" data-library="edit" data-r="${r.id}">Editar raid</button></div></div>${editingRaid===r.id?`<form data-edit="${r.id}"><label>Nombre de la raid<input name="raidName" required value="${esc(r.name)}"></label><p class="small">Cambiar un nombre conserva sus fallos anteriores.</p>${r.players.map(p=>`<label>Integrante<input name="player-${p.id}" required value="${esc(p.name)}"></label>`).join('')}<div class="day-buttons"><button>Guardar cambios</button><button type="button" class="secondary" data-library="cancel" data-r="${r.id}">Cancelar</button><button type="button" class="secondary" data-library="delete" data-r="${r.id}">Eliminar raid</button></div></form>`:''}</div>`).join(''):'<p>Aún no hay raids.</p>' ;let r=getRaid(selectedRaid);if(!r){document.querySelector('#raids').innerHTML='<section><h2>Tu primera raid</h2><p>Crea una raid desde el menú para comenzar.</p></section>';return}let active=activeSession(r),ordered=[...r.sessions].sort((a,b)=>b.date.localeCompare(a.date));document.querySelector('#raids').innerHTML=`<section><div class="bar"><div><h2>${esc(r.name)}</h2><p class="tag">${r.archived?'Archivada':'Activa'} · ${r.players.length} integrantes · ${raidTotal(r)} fallos en total</p></div>${r.archived?'':`<button class="secondary" data-action="archive" data-r="${r.id}">Archivar raid</button>`}</div>${r.archived?'<p class="small">Raid archivada. Puedes añadir o editar días desde la biblioteca.</p>':''}${!r.archived&&active&&active.closed&&active.date!==today()?`<p><button class="secondary" data-action="today" data-r="${r.id}">Volver al día actual</button></p>`:''}${active?sessionView(r,active):''}<details class="day-list"><summary>Días de raid (${ordered.length})</summary><div class="days">${ordered.length?ordered.map(s=>`<div class="day"><div class="bar"><div><strong>${displayDate(s.date)}</strong> · ${s.closed?'Cerrado':'En curso'} · ${total(s)} fallos${s.link?`<br><a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">Abrir FFLogs ↗</a>`:''}</div><button class="secondary" data-action="open" data-r="${r.id}" data-s="${s.id}">Ver / editar</button></div></div>`).join(''):'<p>Aún no hay días registrados.</p>'}</div>${`<form class="date-form" data-form="new-day" data-r="${r.id}"><label>Elegir otra fecha<input type="date" name="date" value="${today()}" required></label><button>Empezar / abrir día</button></form>`}</details></section>`}
function sessionView(r,s){return `<div class="session"><div class="bar"><div><h3>Día ${displayDate(s.date)}</h3><p class="tag">${s.closed?'Día cerrado · Puedes editarlo':'Día en curso'} · ${total(s)} fallos</p></div><button class="secondary" data-action="close" data-r="${r.id}" data-s="${s.id}">${s.closed?'Guardar cambios del día':'Guardar día'}</button></div><div class="cards">${r.players.map(p=>`<div class="card"><button class="hit" data-action="add" data-r="${r.id}" data-s="${s.id}" data-p="${p.id}">${esc(p.name)}<span class="number">${s.counts[p.id]||0}</span>+ Añadir fallo</button><button class="undo" data-action="undo" data-r="${r.id}" data-s="${s.id}" data-p="${p.id}">Deshacer último fallo</button></div>`).join('')}</div><form class="link-form" data-form="link" data-r="${r.id}" data-s="${s.id}"><label>Enlace de FFLogs (opcional)<input type="url" name="link" value="${esc(linkDrafts[r.id+":"+s.id]??s.link??'')}" placeholder="https://www.fflogs.com/reports/..."></label><button class="secondary">Guardar enlace</button> ${s.link?`<a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">Abrir enlace ↗</a>`:''}</form><p class="small">Los fallos se guardan automáticamente. Pulsa «Guardar día» al terminar.</p></div>`}
const createPanel=document.querySelector('#create-panel'),libraryPanel=document.querySelector('#library'),nav=document.querySelector('#nav');
document.querySelector('#show-create').onclick=()=>{nav.open=false;libraryPanel.hidden=true;createPanel.hidden=false};
document.querySelector('#show-library').onclick=()=>{nav.open=false;createPanel.hidden=true;libraryPanel.hidden=false};
document.querySelector('#hide-create').onclick=()=>{createPanel.hidden=true};document.querySelector('#hide-library').onclick=()=>{libraryPanel.hidden=true};
document.querySelector('#library-list').addEventListener('click',e=>{let b=e.target.closest('button[data-library]');if(!b)return;let r=getRaid(b.dataset.r);if(!r)return;switch(b.dataset.library){case 'dashboard':selectedRaid=r.id;openSession[r.id]=r.sessions.find(s=>!s.closed)?.id||r.sessions.find(s=>s.date===today())?.id||'draft';editingRaid=null;libraryPanel.hidden=true;break;case 'edit':editingRaid=r.id;break;case 'cancel':editingRaid=null;break;case 'delete':if(!confirm(`¿Eliminar la raid "${r.name}" y todos sus días, fallos y enlaces? Esta acción no se puede deshacer.`))return;raids=raids.filter(x=>x.id!==r.id);delete openSession[r.id];delete linkDrafts[r.id];if(selectedRaid===r.id)selectedRaid=raids.reduce((best,x)=>!best||(x.lastSavedDay||0)>(best.lastSavedDay||0)?x:best,null)?.id;editingRaid=null;save(raids);break}render()});
document.querySelector('#library-list').addEventListener('submit',e=>{e.preventDefault();let r=getRaid(e.target.dataset.edit);if(!r)return;let f=new FormData(e.target),name=String(f.get('raidName')).trim();let names=r.players.map(p=>String(f.get('player-'+p.id)).trim());if(!name||names.some(n=>!n)){alert('Todos los nombres deben tener contenido.');return}r.name=name;r.players.forEach((p,i)=>p.name=names[i]);editingRaid=null;touch(r);save(raids);render()});
document.querySelector('#create').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim(),names=String(f.get('players')).split('\n').map(n=>n.trim()).filter(Boolean);if(!name||!names.length){alert('Introduce un nombre y al menos un integrante');return}let r={id:uid(),name,archived:false,players:names.map(name=>({id:uid(),name})),sessions:[]};touch(r);raids.unshift(r);selectedRaid=r.id;save(raids);e.target.reset();createPanel.hidden=true;render()});
document.querySelector('#raids').addEventListener('submit',e=>{e.preventDefault();const form=e.target,r=getRaid(form.dataset.r);if(!r)return;const f=new FormData(form);if(form.dataset.form==='new-day'){const date=String(f.get('date'));let s=r.sessions.find(s=>s.date===date);if(!s){let current=r.sessions.find(s=>!s.closed);if(current){alert('Acaba el día en curso antes de empezar otro.');return}s={id:uid(),date,closed:false,link:'',counts:{}};r.sessions.push(s);touch(r)}openSession[r.id]=s.id}else if(form.dataset.form==='link'){let link=String(f.get('link')).trim();if(link){try{let u=new URL(link);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{alert('Introduce un enlace válido que empiece por http:// o https://');return}}let s=materialize(r,form.dataset.s);if(!s)return;s.link=link;delete linkDrafts[r.id+':'+form.dataset.s];touch(r)}save(raids);render()});
document.querySelector('#raids').addEventListener('input',e=>{if(e.target.name==='link'){let form=e.target.closest('form');if(form)linkDrafts[form.dataset.r+':'+form.dataset.s]=e.target.value}});
document.querySelector('#raids').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const r=getRaid(b.dataset.r);if(!r)return;let s;if(['add','undo','close'].includes(b.dataset.action))s=materialize(r,b.dataset.s);else s=r.sessions.find(s=>s.id===b.dataset.s);switch(b.dataset.action){case 'today':delete openSession[r.id];render();return;case 'archive':if(!confirm('¿Archivar esta raid? Podrás seguir consultando y editando sus días.'))return;r.archived=true;for(const x of r.sessions)x.closed=true;openSession[r.id]='none';break;case 'open':if(!s)return;openSession[r.id]=s.id;render();return;case 'close':if(!s)return;{let link=(linkDrafts[r.id+':'+b.dataset.s]??linkDrafts[r.id+':'+s.id]??s.link??'').trim();if(link){try{let u=new URL(link);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{alert('Introduce un enlace válido que empiece por http:// o https://');return}}s.link=link;delete linkDrafts[r.id+':'+b.dataset.s]}s.closed=true;s.savedAt=Date.now();r.lastSavedDay=s.savedAt;openSession[r.id]=s.id;break;case 'add':if(!s)return;s.counts[b.dataset.p]=(s.counts[b.dataset.p]||0)+1;break;case 'undo':if(!s)return;s.counts[b.dataset.p]=Math.max(0,(s.counts[b.dataset.p]||0)-1);break;default:return}touch(r);save(raids);render()});render();
</script></body></html>
