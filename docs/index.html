<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raid Tracker</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui;background:#111321;color:#e9e8f5;margin:0}main{max-width:1050px;margin:auto;padding:30px 20px}h1{font-size:2.2rem;margin-bottom:4px}h2{margin-top:0}p,.muted{color:#aaaec4}section{background:#1b1e30;border:1px solid #30344c;border-radius:16px;padding:22px;margin:22px 0}button,input,textarea{font:inherit;border-radius:9px;border:1px solid #4a4d65;padding:11px}input,textarea{background:#111321;color:white;width:100%;margin:6px 0 12px}button{cursor:pointer;background:#7456d9;color:white;border:0}button:hover{filter:brightness(1.18)}.secondary{background:#34384d}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#292d43;border-radius:12px;padding:12px}.hit{width:100%;min-height:112px;background:#373052;font-size:1.1rem}.number{display:block;font-size:2rem;font-weight:bold}.undo{width:100%;margin-top:7px;background:#373b51}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.tag{color:#c7b9ff}.row{padding:5px 0;border-bottom:1px solid #35384c}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><h1>Raid Tracker</h1><p>Registra los fallos durante la raid y consulta su evolución.</p><p>Versión de prueba: los datos se guardan solo en este navegador y dispositivo. Si borras los datos del navegador, se perderán.</p><section><h2>Nueva raid</h2><form id="create"><label>Nombre de la raid<input name="name" required placeholder="Ej. Tier de junio"></label><label>Integrantes, uno por línea<textarea name="players" rows="4" required placeholder="Nombre 1&#10;Nombre 2"></textarea></label><button>Crear raid</button></form></section><div id="raids"></div></main><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='raid-tracker-v1';
function read(){return JSON.parse(localStorage.getItem(KEY)||'[]')}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
async function post(path,data){let raids=read();if(path==='create'){let names=data.players.map(x=>x.trim()).filter(Boolean);if(!data.name.trim()||!names.length)throw Error('Introduce un nombre y al menos un integrante');raids.unshift({id:crypto.randomUUID(),name:data.name.trim(),archived:false,players:names.map(name=>({id:crypto.randomUUID(),name,mistakes:[]}))})}else if(path==='archive'){let r=raids.find(r=>r.id===data.raid_id);if(r)r.archived=true}else{let r=raids.find(r=>r.players.some(p=>p.id===data.player_id));if(!r||r.archived)throw Error('Raid no disponible');let p=r.players.find(p=>p.id===data.player_id);if(path==='mistake')p.mistakes.push(new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()));if(path==='undo')p.mistakes.pop()}save(raids)}
function listRaids(){return read().map(r=>({...r,players:r.players.map(p=>({...p,total:p.mistakes.length})),days:r.players.flatMap(p=>Object.entries(p.mistakes.reduce((o,d)=>(o[d]=(o[d]||0)+1,o),{})).map(([day,total])=>({day,name:p.name,total}))).sort((a,b)=>b.day.localeCompare(a.day))}))}
async function refresh(){const raids=listRaids();document.querySelector('#raids').innerHTML=raids.length?raids.map(r=>`<section><div class="bar"><div><h2>${esc(r.name)}</h2><p class="tag">${r.archived?'Archivada':'Activa'} · ${r.players.length} integrantes · ${r.players.reduce((n,p)=>n+p.total,0)} fallos</p></div>${r.archived?'':`<button class="secondary" onclick="archiveRaid('${r.id}')">Archivar raid</button>`}</div><div class="cards">${r.players.map(p=>`<div class="card"><button class="hit" ${r.archived?'disabled':''} onclick="act('mistake','${p.id}')">${esc(p.name)}<span class="number">${p.total}</span>${r.archived?'fallos':'+ Añadir fallo'}</button>${r.archived?'':`<button class="undo" onclick="act('undo','${p.id}')">Deshacer último fallo</button>`}</div>`).join('')}</div><details><summary>Historial por día</summary>${r.days.length?r.days.map(d=>`<div class="row">${esc(d.day)} · ${esc(d.name)}: ${d.total}</div>`).join(''):'<p>Aún no hay fallos registrados.</p>'}</details></section>`).join(''):'<p>Todavía no hay raids. Crea la primera arriba.</p>'}
async function act(action,id){try{await post(action,{player_id:id});await refresh()}catch(e){alert(e.message)}}async function archiveRaid(id){if(confirm('¿Archivar esta raid? Ya no se podrán añadir ni deshacer fallos.')){await post('archive',{raid_id:id});await refresh()}}document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await post('create',{name:f.get('name'),players:f.get('players').split('\n')});e.target.reset();await refresh()}catch(err){alert(err.message)}};refresh();
</script></body></html>
